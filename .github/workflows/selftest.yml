name: selftest

on:
  push:
  pull_request:

jobs:
  taskfix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy patcher regression
        run: |
          chmod +x selftest.sh
          ./selftest.sh
      - name: Standalone add-on syntax and behavior
        run: |
          node --check addon/content/taskfix-window.js
          node --check addon/api/TaskFix/implementation.js
          node --check addon/background.js
          node tests/taskfix-addon-harness.js
      - name: Build standalone XPI
        run: |
          chmod +x packaging/build-xpi.sh
          packaging/build-xpi.sh /tmp/thunderbird-taskfix-0.3.0.xpi
          python3 tests/check-xpi.py /tmp/thunderbird-taskfix-0.3.0.xpi
      - name: Publish tested XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-taskfix-0.3.0
          path: /tmp/thunderbird-taskfix-0.3.0.xpi
          if-no-files-found: error
