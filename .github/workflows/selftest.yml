name: selftest

on:
  push:
  pull_request:

jobs:
  patcher-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n apply.sh uninstall.sh selftest.sh
      - name: Run TaskFix self-test
        run: |
          chmod +x selftest.sh
          ./selftest.sh
