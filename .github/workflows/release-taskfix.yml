name: release-taskfix

on:
  push:
    branches:
      - main
      - "release/taskfix-*"
    paths:
      - "addon/**"
      - "packaging/build-xpi.sh"
      - "tests/check-xpi.py"
      - "tests/taskfix-addon-harness.js"
      - "tests/taskfix-late-panel-harness.js"
      - ".github/workflows/release-taskfix.yml"
  pull_request:
    branches:
      - main
    paths:
      - "addon/**"
      - "packaging/build-xpi.sh"
      - "tests/check-xpi.py"
      - "tests/taskfix-addon-harness.js"
      - "tests/taskfix-late-panel-harness.js"
      - ".github/workflows/release-taskfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate add-on
        run: |
          node --check addon/content/taskfix-window.js
          node --check addon/api/TaskFix/implementation.js
          node --check addon/background.js
          node tests/taskfix-addon-harness.js
          node tests/taskfix-late-panel-harness.js

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("addon/manifest.json"))["version"])')"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TAG="v$VERSION-rc.$GITHUB_RUN_NUMBER"
            PRERELEASE="true"
            TARGET="${{ github.event.pull_request.head.sha }}"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TAG="v$VERSION"
            PRERELEASE="false"
            TARGET="$GITHUB_SHA"
          else
            TAG="v$VERSION-rc.$GITHUB_RUN_NUMBER"
            PRERELEASE="true"
            TARGET="$GITHUB_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build XPI
        run: |
          chmod +x packaging/build-xpi.sh
          packaging/build-xpi.sh "$GITHUB_WORKSPACE/dist/thunderbird-taskfix-${{ steps.release.outputs.version }}.xpi"
          python3 tests/check-xpi.py "$GITHUB_WORKSPACE/dist/thunderbird-taskfix-${{ steps.release.outputs.version }}.xpi"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          args=(
            release create "$TAG"
            "$GITHUB_WORKSPACE/dist/thunderbird-taskfix-$VERSION.xpi"
            --target "${{ steps.release.outputs.target }}"
            --title "Thunderbird TaskFix $TAG"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
