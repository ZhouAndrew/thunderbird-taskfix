<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CalDAV Assistant Experimental</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <main>
    <header class="app-header">
      <h1>CalDAV Assistant</h1>
    </header>

    <nav class="tool-nav" aria-label="CalDAV Assistant">
      <a class="active" href="workspace.html">工作</a>
      <a href="today.html">今天</a>
      <a href="record.html">记录</a>
      <a href="logs.html">日志</a>
      <a href="tools.html">工具</a>
    </nav>

    <div id="notice" class="notice" hidden></div>

    <div class="work-layout">
      <section class="card task-browser">
        <div class="task-filters">
          <select id="task-view" aria-label="Task 视图">
            <option value="incomplete">未完成</option>
            <option value="today">今天</option>
            <option value="overdue">已逾期</option>
            <option value="completed">已完成</option>
            <option value="all">全部</option>
          </select>
          <select id="task-calendar-filter" aria-label="Task Calendar"></select>
        </div>
        <input id="task-search" type="search" placeholder="搜索 Task">
        <div id="task-list" class="item-list"></div>
      </section>

      <section class="card task-panel">
        <div id="no-selection" class="empty-state">请选择一个 Task</div>

        <div id="selection" hidden>
          <h2 id="selected-title"></h2>
          <div id="selected-state" class="task-state"></div>
          <div id="selected-due" class="task-secondary"></div>
          <div id="elapsed-block" class="elapsed-block" hidden>
            <span>累计</span>
            <strong id="selected-elapsed">00:00:00</strong>
          </div>

          <div id="actions" class="action-row"></div>

          <div id="cancel-confirm" class="inline-confirm" hidden>
            <strong>确定取消这个 Task？</strong>
            <button id="cancel-confirm-yes" class="danger">确认取消</button>
            <button id="cancel-confirm-no">返回</button>
          </div>

          <p id="flow-note" class="muted"></p>
        </div>

        <section class="recent-result">
          <div class="section-title">
            <h3>最近结果</h3>
            <a href="logs.html">查看详细日志</a>
          </div>
          <div id="receipt">尚无工作结果。</div>
        </section>
      </section>
    </div>
  </main>

  <script src="core/storage.js"></script>
  <script src="core/executor.js"></script>
  <script src="workspace.js"></script>
</body>
</html>
