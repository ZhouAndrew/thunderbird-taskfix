name: selftest

on:
  push:
  pull_request:

jobs:
  taskfix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy patcher regression
        run: |
          chmod +x selftest.sh
          ./selftest.sh
      - name: Add-on syntax and existing task behavior
        run: |
          node --check addon/content/taskfix-window.js
          node --check addon/api/TaskFix/implementation.js
          node --check addon/api/ThunderbirdCalDAV/implementation.js
          node --check addon/background.js
          node --check addon/workspace.js
          node tests/taskfix-addon-harness.js
          node tests/direct-caldav-api-harness.js
          bash -n tests/real-thunderbird-caldav.sh
      - name: Build direct Thunderbird CalDAV XPI
        run: |
          chmod +x packaging/build-xpi.sh
          packaging/build-xpi.sh /tmp/thunderbird-caldav-lab-0.3.4.xpi
          python3 tests/check-xpi.py /tmp/thunderbird-caldav-lab-0.3.4.xpi
      - name: Publish tested XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-caldav-lab-0.3.4
          path: /tmp/thunderbird-caldav-lab-0.3.4.xpi
          if-no-files-found: error
