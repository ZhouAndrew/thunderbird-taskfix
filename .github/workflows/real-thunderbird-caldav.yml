name: real-thunderbird-caldav

on:
  push:
    branches:
      - "rewrite/direct-thunderbird-caldav"
      - "feat/caldav-assistant-workflow-*"
  pull_request:

jobs:
  real-thunderbird:
    name: real-thunderbird (${{ matrix.thunderbird }}, ${{ matrix.timezone }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        thunderbird:
          - "153.0.2esr"
          - "153.1.0esr"
          - "153.1.1esr"
        timezone:
          - "UTC"
          - "Asia/Shanghai"
    steps:
      - uses: actions/checkout@v4

      - name: Install acceptance dependencies
        run: |
          python3 -m pip install --user "radicale==3.5.4"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Real Thunderbird + real Radicale acceptance
        env:
          ACCEPTANCE_ARTIFACT_DIR: ${{ github.workspace }}/acceptance-artifacts/${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
        run: |
          chmod +x tests/real-thunderbird-caldav.sh
          tests/real-thunderbird-caldav.sh "${{ matrix.thunderbird }}" "${{ matrix.timezone }}"

      - name: Upload CalDAV Assistant diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-diagnostics-${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
          path: acceptance-artifacts/${{ matrix.thunderbird }}-${{ matrix.timezone == 'Asia/Shanghai' && 'Asia-Shanghai' || matrix.timezone }}
          if-no-files-found: warn
