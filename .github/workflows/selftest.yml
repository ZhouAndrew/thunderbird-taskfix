name: selftest

on:
  push:
  pull_request:

jobs:
  taskfix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy patcher regression
        run: |
          chmod +x selftest.sh
          ./selftest.sh
      - name: Add-on syntax and behavior
        run: |
          node --check addon/content/taskfix-window.js
          node --check addon/api/TaskFix/implementation.js
          node --check addon/api/ThunderbirdCalDAV/implementation.js
          node --check addon/background.js
          node --check addon/core/storage.js
          node --check addon/core/executor.js
          node --check addon/core/connection.js
          node --check addon/core/wordpress.js
          node --check addon/workspace.js
          node --check addon/logs.js
          node --check addon/connections.js
          node --check addon/record.js
          node --check addon/today.js
          node tests/taskfix-addon-harness.js
          node tests/direct-caldav-api-harness.js
          node tests/workflow-harness.js
          node tests/wordpress-connector-harness.js
          bash -n tests/real-thunderbird-caldav.sh
      - name: Build CalDAV Assistant Experimental XPI
        run: |
          chmod +x packaging/build-xpi.sh
          packaging/build-xpi.sh /tmp/caldav-assistant-experimental-0.3.5.xpi
          python3 tests/check-xpi.py /tmp/caldav-assistant-experimental-0.3.5.xpi
      - name: Publish tested XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: caldav-assistant-experimental-0.3.5
          path: /tmp/caldav-assistant-experimental-0.3.5.xpi
          if-no-files-found: error
